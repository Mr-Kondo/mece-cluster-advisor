name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows の python が cp1252 で日本語を出して落ちるのを避け、ログも読めるようにする
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: 単体テストの実行
        shell: bash
        run: |
          uv run scripts/test_mece_cluster.py
      - name: 版と実行環境の出力の確認
        shell: bash
        run: |
          ${{ matrix.python }} scripts/test_skill_info.py
