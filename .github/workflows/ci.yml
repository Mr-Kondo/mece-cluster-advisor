name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows の python が cp1252 で日本語を出して落ちるのを避け、ログも読めるようにする
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: インストール(uv run、取得はしない)
        shell: bash
        run: |
          set -eu
          target="$HOME/.claude/skills/mece-cluster-advisor"
          uv run install.py --no-fetch
          test -f "$target/SKILL.md"
          test -f "$target/scripts/mece_cluster.py"
          test ! -e "$target/.claude"         # 実行環境の設定は持ち込まない
          test ! -e "$target/__pycache__"
          test ! -e "$target/.gitignore"
          test ! -e "$target/.git"
      - name: インストール元と同じ場所からは実行できない
        shell: bash
        run: |
          set -eu
          target="$HOME/.claude/skills/mece-cluster-advisor"
          if (cd "$target" && uv run install.py --target claude); then
            echo "error: 自己上書きを拒否しなかった"
            exit 1
          fi
          test -f "$target/SKILL.md"          # 消えていない
      - name: アンインストールと再インストール(uv なし)
        shell: bash
        run: |
          set -eu
          ${{ matrix.python }} install.py --uninstall
          test ! -e "$HOME/.claude/skills/mece-cluster-advisor"
          ${{ matrix.python }} install.py --target codex --no-fetch
          test -f "$HOME/.agents/skills/mece-cluster-advisor/SKILL.md"
          ${{ matrix.python }} install.py --uninstall --target all
          test ! -e "$HOME/.agents/skills/mece-cluster-advisor"
      - name: 取得したモデルも消せる(--purge)
        shell: bash
        run: |
          set -eu
          cache="$HOME/.cache/huggingface/hub/models--cl-nagoya--ruri-v3-310m"
          mkdir -p "$cache/snapshots/x"
          echo dummy > "$cache/snapshots/x/model.safetensors"
          ${{ matrix.python }} install.py --purge
          test ! -e "$cache"
